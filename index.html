<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarigen deze maand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c1c1b; --card:#403d34; --card-deep:#2c2a24; --card-hi:#5a5647;
    --teal:#9c9a92; --green:#BE9F56; --amber:#e4d3ab; --orange:#E4200E;
    --ink:#F8F5EC; --ink-dim:#DED8C9; --ink-faint:#ADA694;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif; min-height:100vh;
    padding:64px 24px 96px;
  }
  .wrap{max-width:760px; margin:0 auto;}
  .eyebrow{
    font-size:13px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-faint); margin:0 0 8px;
  }
  h1{
    font-family:'Fraunces',serif; font-weight:600; font-size:clamp(32px,6vw,52px);
    margin:0 0 40px; color:var(--ink); line-height:1.05;
  }
  h1 span{color:var(--green);}
  .list{display:flex; flex-direction:column; gap:2px;}
  .row{
    display:flex; align-items:center; gap:20px;
    background:var(--card); border-radius:10px;
    padding:18px 22px; position:relative; overflow:hidden;
  }
  .row + .row{margin-top:6px;}
  .flame{
    flex:0 0 auto; width:6px; align-self:stretch; border-radius:4px;
    background:linear-gradient(180deg, var(--orange), var(--green));
  }
  .info{flex:1; min-width:0;}
  .name{
    font-size:17px; font-weight:600; color:var(--ink); margin:0 0 2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .dept{
    font-size:13px; color:var(--ink-faint); margin:0;
  }
  .date{
    flex:0 0 auto; text-align:right; font-family:'Fraunces',serif;
  }
  .day{font-size:22px; font-weight:600; color:var(--amber); line-height:1;}
  .month{
    display:block; font-family:'Inter',sans-serif; font-size:11px;
    letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin-top:2px;
  }
  .empty{
    color:var(--ink-faint); font-size:15px; padding:40px 0; text-align:center;
  }
  footer{
    max-width:760px; margin:56px auto 0; text-align:center;
    font-size:12px; color:var(--ink-faint);
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Omer Vanderghinste &middot; HR</p>
    <h1>Jarigen in <span>{{MAAND}}</span></h1>

    <div class="list">
      {{RIJEN}}
    </div>
  </div>

  <footer>Automatisch bijgewerkt &middot; HR_Personeel</footer>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var list = document.querySelector('.list');
      if (!list) return;
      var rows = Array.prototype.slice.call(list.querySelectorAll('.row'));
      rows.sort(function (a, b) {
        return parseInt(a.dataset.day, 10) - parseInt(b.dataset.day, 10);
      });
      rows.forEach(function (row) { list.appendChild(row); });
    });
  </script>
</body>
</html>
