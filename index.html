<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarigen deze maand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c1c1b; --card:#403d34; --card-deep:#2c2a24; --card-hi:#5a5647;
    --teal:#9c9a92; --green:#BE9F56; --amber:#e4d3ab; --orange:#E4200E;
    --ink:#F8F5EC; --ink-dim:#DED8C9; --ink-faint:#ADA694;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; overflow:hidden;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif;
    padding:32px 40px 20px;
    display:flex; flex-direction:column;
  }
  .wrap{width:100%;}
  .eyebrow{
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-faint); margin:0 0 4px;
  }
  h1{
    font-family:'Fraunces',serif; font-weight:600; font-size:clamp(24px,3.2vw,36px);
    margin:0 0 20px; color:var(--ink); line-height:1.05;
  }
  h1 span{color:var(--green);}
  .list{
    flex:1; min-height:0;
    display:grid;
    grid-auto-flow:column;
    grid-template-rows:repeat(auto-fill, minmax(52px,1fr));
    grid-auto-columns:minmax(280px,1fr);
    gap:8px 18px;
  }
  .row{
    display:flex; align-items:center; gap:14px;
    background:var(--card); border-radius:8px;
    padding:8px 14px; position:relative; overflow:hidden;
  }
  .flame{
    flex:0 0 auto; width:4px; align-self:stretch; border-radius:3px;
    background:linear-gradient(180deg, var(--orange), var(--green));
  }
  .info{flex:1; min-width:0;}
  .name{
    font-size:14px; font-weight:600; color:var(--ink); margin:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .dept{
    font-size:11px; color:var(--ink-faint); margin:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .date{
    flex:0 0 auto; text-align:right; font-family:'Fraunces',serif;
  }
  .day{font-size:16px; font-weight:600; color:var(--amber); line-height:1;}
  .month{
    display:block; font-family:'Inter',sans-serif; font-size:9px;
    letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint);
  }
  .empty{
    color:var(--ink-faint); font-size:15px; padding:40px 0; text-align:center;
  }
  footer{
    margin:12px 0 0; text-align:center;
    font-size:11px; color:var(--ink-faint); flex:0 0 auto;
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Omer Vanderghinste &middot; HR</p>
    <h1>Jarigen in <span>{{MAAND}}</span></h1>

    <div class="list">
      {{RIJEN}}
    </div>
  </div>

  <footer>Automatisch bijgewerkt &middot; HR_Personeel</footer>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var list = document.querySelector('.list');
      if (!list) return;
      var rows = Array.prototype.slice.call(list.querySelectorAll('.row'));
      rows.sort(function (a, b) {
        return parseInt(a.dataset.day, 10) - parseInt(b.dataset.day, 10);
      });
      rows.forEach(function (row) { list.appendChild(row); });
    });
  </script>
</body>
</html>
